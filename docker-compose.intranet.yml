services:
  postgres:
    image: >-
      postgres:16-alpine@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
    pull_policy: always

  redis:
    image: >-
      redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    pull_policy: always

  backend:
    image: >-
      ghcr.io/finalmethos-ops/btsp-backend:v1.0.0-rc.41@sha256:95619904bb268b9ea2c934df3be9ef72c66c8c4925ab0d024e3a40cb92ad3516
    build: !reset null
    pull_policy: always
    env_file: !override
      - .env.intranet

  frontend:
    image: >-
      ghcr.io/finalmethos-ops/btsp-frontend:v1.0.0-rc.41@sha256:9228dd14d04eb002fedcbd95a6d564ba7b2cc7de624b47521f0c1dc694a26211
    build: !reset null
    pull_policy: always

  nginx:
    image: >-
      nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    pull_policy: always
    ports: !override
      # The public deployment uses the outbound Cloudflare Tunnel. Keep the
      # fallback host listeners loopback-only so the origin is not reachable
      # directly from the LAN or the Internet.
      - "${BTSP_BIND_ADDRESS:-127.0.0.1}:${NGINX_PORT:-18080}:80"
      - "${BTSP_BIND_ADDRESS:-127.0.0.1}:${NGINX_TLS_PORT:-18443}:443"
    volumes: !override
      - ./infrastructure/nginx/intranet.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infrastructure/nginx/security-headers.conf:/etc/nginx/snippets/btsp-security-headers.conf:ro
      - ./.runtime/tls/server:/etc/nginx/tls:ro

# These file stores contain production records and are intentionally managed
# outside the Compose lifecycle. Explicit names prevent project-name drift,
# and `external` prevents a deployment from silently creating empty volumes
# when a durable store is missing.
volumes:
  attachment_data:
    external: true
    name: btsp-intranet_attachment_data
  purchase_order_export_data:
    external: true
    name: btsp-intranet_purchase_order_export_data
  analytics_report_data:
    external: true
    name: btsp-intranet_analytics_report_data
  invoice_intake_data:
    external: true
    name: btsp-intranet_invoice_intake_data
