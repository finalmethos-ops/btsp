upstream btsp_frontend {
    server frontend:3000;
}

upstream btsp_backend {
    server backend:8000;
}

map $http_cf_connecting_ip $btsp_tunnel_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

map $server_port $btsp_client_ip {
    4443    $btsp_tunnel_client_ip;
    default $remote_addr;
}

# Defense-in-depth for credential abuse. FastAPI also applies Redis-backed
# email and client limits; this edge limit prevents a burst from consuming
# backend workers before those checks run.
limit_req_zone $btsp_tunnel_client_ip zone=btsp_auth:10m rate=20r/m;

log_format btsp_json escape=json
    '{"timestamp":"$time_iso8601","request_id":"$request_id",'
    '"client_ip":"$btsp_client_ip","method":"$request_method","path":"$uri",'
    '"status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time","user_agent":"$http_user_agent"}';

server {
    listen 80;
    server_name _;
    server_tokens off;
    return 308 https://$host:18443$request_uri;
}

server {
    listen 443 ssl;
    # Docker-internal listener reserved for Cloudflare Tunnel. This port is not
    # published by Compose, so CF-Connecting-IP is trusted only on this path.
    listen 4443 ssl;
    server_name _;
    server_tokens off;
    client_max_body_size 11m;
    access_log /var/log/nginx/access.log btsp_json;

    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:BTSP:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $btsp_frontend http://frontend:3000;
    set $btsp_backend http://backend:8000;

    include /etc/nginx/snippets/btsp-security-headers.conf;

    # Drop common automated CMS/secrets probes at the edge. BTSP does not
    # expose these resources; returning here avoids waking the Next.js or API
    # upstream while leaving normal application routes untouched.
    location ~* ^/(wp-admin|wp-login\.php|xmlrpc\.php|phpmyadmin|cgi-bin)(/|$) {
        access_log off;
        log_not_found off;
        return 404;
    }

    location ~* ^/(\.env|\.git)(/|$) {
        access_log off;
        log_not_found off;
        return 404;
    }

    location = /api/v1/auth/login {
        limit_req zone=btsp_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass $btsp_backend;
        proxy_http_version 1.1;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header X-Request-ID;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $btsp_client_ip;
        proxy_set_header X-Forwarded-For $btsp_client_ip;
        proxy_set_header CF-Connecting-IP $btsp_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location /api/ {
        proxy_pass $btsp_backend;
        proxy_http_version 1.1;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header X-Request-ID;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $btsp_client_ip;
        proxy_set_header X-Forwarded-For $btsp_client_ip;
        proxy_set_header CF-Connecting-IP $btsp_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /event-sw.js {
        proxy_pass $btsp_frontend;
        # Defining Cache-Control here stops nginx from inheriting server-level
        # add_header directives, so re-include the security header set.
        include /etc/nginx/snippets/btsp-security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location /_next/static/ {
        proxy_pass $btsp_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $btsp_client_ip;
        proxy_set_header X-Forwarded-For $btsp_client_ip;
        proxy_set_header CF-Connecting-IP $btsp_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/btsp-security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location / {
        proxy_pass $btsp_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $btsp_client_ip;
        proxy_set_header X-Forwarded-For $btsp_client_ip;
        proxy_set_header CF-Connecting-IP $btsp_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/btsp-security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
}
